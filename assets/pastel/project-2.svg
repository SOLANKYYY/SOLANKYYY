41 125Q1605 96 1550.0 66.0Q1495 36 1433.5 11.0Q1372 -14 1311.5 -29.5Q1251 -45 1205 -45Q1151 -45 1097.5 -5.5Q1044 34 982.5 117.0Q921 200 847.0 327.5Q773 455 677 632Z" transform="translate(269.04 91.00) scale(0.017090 -0.017090)"/></g><path class="ribbon" d="M44 112Q480.0 102 916 112" fill="none" stroke="#dfd2ee" stroke-width="2"/><text x="44" y="151" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#70548b">A workspace for cyber threat intelligence</text><text x="44" y="209" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#443e50">A Python and Flask application for searching security reports and PDF evidence, tracking</text><text x="44" y="243" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#443e50">document processing, and recording analyst decisions. MongoDB supports the</text><text x="44" y="277" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#443e50">workspace&#x27;s data, while PDF extraction makes report content available for exploration.</text><text x="44" y="332" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#443e50">This project focuses on organizing information into a usable investigation workflow. Its</text><text x="44" y="366" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#443e50">ratings use deterministic rules, with the evidence and analyst decisions kept visible.</text><text x="44" y="421" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#70548b">Tools &amp; technologies</text><text x="44" y="458" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#443e50">Python · Flask · MongoDB · PyMongo · pypdf · JavaScript</text><text x="44" y="513" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#70548b">Explore the project →</text></g><rect x="1" y="1" width="958" height="555" rx="24" fill="none" stroke="#dfd2ee"/></svg>
