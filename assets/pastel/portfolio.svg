<svg xmlns="http://www.w3.org/2000/svg" width="180" height="48" viewBox="0 0 180 48" role="img" aria-labelledby="title desc">
<title id="title">Portfolio ↗</title><desc id="desc">Portfolio ↗. Full text is available in PROFILE.md.</desc>
<style>
  .orbit{transform-box:fill-box;transform-origin:center;animation:spin 32s linear infinite}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-out infinite}
  .ribbon{stroke-dasharray:8 14;animation:flow 12s linear infinite}
  .float{animation:float 12s ease-in-out infinite alternate}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%{transform:scale(1);opacity:.45}80%,100%{transform:scale(2.1);opacity:0}}
  @keyframes flow{to{stroke-dashoffset:-220}}
  @keyframes float{to{transform:translateX(28px)}}
  @media(prefers-reduced-motion:reduce){.orbit,.pulse,.ribbon,.float{animation:none}.pulse{opacity:.15}}
</style><defs><clipPath id="frame"><rect x="1" y="1" width="178" height="46" rx="24"/></clipPath></defs>
<g clip-path="url(#frame)"><rect width="180" height="48" fill="#fff5ee"/>
<circle class="float" cx="160" cy="0" r="150" fill="#efd8ca" opacity=".28"/>
<text x="90" y="31" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#9b5a45">Portfolio ↗</text></g><rect x="1" y="1" width="178" height="46" rx="24" fill="none" stroke="#efd8ca"/></svg>
