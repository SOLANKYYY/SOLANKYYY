29 339 713V696Q339 568 371.5 462.0Q404 356 461.0 280.5Q518 205 595.0 163.0Q672 121 761 121Q851 121 945.5 165.5Q1040 210 1137 310ZM949 1113Q949 1159 933.5 1199.0Q918 1239 890.5 1268.5Q863 1298 825.0 1315.0Q787 1332 743 1332Q678 1332 625.0 1309.0Q572 1286 530.0 1246.5Q488 1207 456.0 1154.5Q424 1102 401.5 1043.0Q379 984 365.0 922.0Q351 860 345 801Q487 811 599.5 835.5Q712 860 789.5 898.5Q867 937 908.0 990.5Q949 1044 949 1113Z" transform="translate(378.65 91.00) scale(0.017090 -0.017090)"/></g><path class="ribbon" d="M44 112Q480.0 102 916 112" fill="none" stroke="#dfd2ee" stroke-width="2"/><text x="44" y="151" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#443e50">I&#x27;m Om Solanki, an AI/ML student based in Bengaluru, India, pursuing a B.Tech in</text><text x="44" y="185" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#443e50">Computer Science &amp; AI/ML at Jain University.</text><text x="44" y="240" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#443e50">I enjoy working at the intersection of machine learning and software development:</text><text x="44" y="274" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#443e50">understanding a dataset, experimenting with a model, and building an interface that makes</text><text x="44" y="308" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#443e50">the result easier to explore. My projects span computer vision, local language-model</text><text x="44" y="342" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#443e50">evaluation, security analytics, and web applications.</text><text x="44" y="397" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#443e50">I&#x27;m especially interested in the details that make an experiment understandable: clear</text><text x="44" y="431" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#443e50">inputs, useful baselines, visible limitations, and results someone else can inspect.</text><text x="44" y="465" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#443e50">Alongside project work, I&#x27;m strengthening my foundations in data structures, algorithms,</text><text x="44" y="499" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#443e50">databases, and application design.</text></g><rect x="1" y="1" width="958" height="568" rx="24" fill="none" stroke="#dfd2ee"/></svg>
