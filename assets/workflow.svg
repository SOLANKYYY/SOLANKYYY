<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="260" viewBox="0 0 1280 260" role="img" aria-labelledby="title desc">
  <title id="title">From a question to a working application</title>
  <desc id="desc">Understand the problem, experiment with baselines, build the application, evaluate and refine.</desc>
  <style>
    .flow { stroke-dasharray: 14 20; animation: flow 9s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -340; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>
  <rect x="1" y="1" width="1278" height="258" rx="24" fill="#f7faf5" stroke="#d7e4d9"/>
  <path d="M160 108H1120" stroke="#d3e4d5" stroke-width="2"/>
  <path class="flow" d="M160 108H1120" stroke="#3b9b64" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <circle cx="160" cy="108" r="27" fill="#fffefa" stroke="#b7d5c0"/><text x="160" y="114" font-size="16" fill="#207144">01</text>
    <text x="160" y="173" font-size="24" font-weight="700" fill="#234b34">Understand</text><text x="160" y="205" font-size="14" fill="#5b7363">Problem · data · constraints</text>
    <circle cx="480" cy="108" r="27" fill="#fffefa" stroke="#b7d5c0"/><text x="480" y="114" font-size="16" fill="#207144">02</text>
    <text x="480" y="173" font-size="24" font-weight="700" fill="#234b34">Experiment</text><text x="480" y="205" font-size="14" fill="#5b7363">Baselines · models · evidence</text>
    <circle cx="800" cy="108" r="27" fill="#fffefa" stroke="#b7d5c0"/><text x="800" y="114" font-size="16" fill="#207144">03</text>
    <text x="800" y="173" font-size="24" font-weight="700" fill="#234b34">Build</text><text x="800" y="205" font-size="14" fill="#5b7363">APIs · interfaces · integration</text>
    <circle cx="1120" cy="108" r="27" fill="#fffefa" stroke="#b7d5c0"/><text x="1120" y="114" font-size="16" fill="#207144">04</text>
    <text x="1120" y="173" font-size="24" font-weight="700" fill="#234b34">Refine</text><text x="1120" y="205" font-size="14" fill="#5b7363">Evaluate · document · iterate</text>
