ext x="12" y="275" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="var(--ink)">Establish a baseline, compare results, and inspect</text><text x="12" y="304" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="var(--ink)">errors as well as headline metrics.</text><text x="12" y="350" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="var(--accent)">03 · Build</text><text x="12" y="382" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="var(--ink)">Connect processing, inference or application logic,</text><text x="12" y="411" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="var(--ink)">APIs, and an interface people can use.</text><text x="12" y="457" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="var(--accent)">04 · Refine</text><text x="12" y="489" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="var(--ink)">Document assumptions and limitations, then use</text><text x="12" y="518" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="var(--ink)">what the project reveals to guide the next iteration.</text></g></svg>
