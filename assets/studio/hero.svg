<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 210" width="1050" height="210" role="img" aria-labelledby="title desc">
  <title id="title">Signal Desk, RetinaBridge and AgriLens</title>
  <desc id="desc">Three document excerpts represent a maximum of three retrieved passages. Five bars represent retinal model grades zero through four. Twenty-two dots represent the crop labels in the benchmark.</desc>
  <defs><clipPath id="paper"><rect width="1050" height="210" rx="16"/></clipPath></defs>
  <style>
    .title { font-family: "Helvetica Neue", Arial, sans-serif; font-weight: 650; }
    .caption { font-family: "Helvetica Neue", Arial, sans-serif; }
    .metric { font-family: Georgia, "DejaVu Serif", serif; font-weight: 400; }
  </style>
  <g clip-path="url(#paper)">
  <g transform="translate(0 0)">
    <rect width="350" height="210" fill="#132f30"/>
    <path d="M0 2h350" stroke="#a5e7cc" stroke-width="4"/>
    <text class="title" x="24" y="49" font-size="27" fill="#f3fcf4">Signal Desk</text>
    <text class="metric" x="20" y="143" font-size="86" fill="#a5e7cc">≤3</text>
    <text class="caption" x="25" y="184" font-size="20" fill="#d2e5dc">Source passages per question</text>
    <g transform="translate(187 62) scale(1.13)" color="#a5e7cc">
    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
      <rect x="7" y="6" width="62" height="36" rx="4" opacity=".45"/>
      <path d="M16 15h22m-22 6h13" opacity=".6"/>
      <rect x="27" y="22" width="63" height="36" rx="4" fill="#132f30" opacity=".84"/>
      <path d="M36 31h21m-21 6h14" opacity=".8"/>
      <rect x="47" y="38" width="64" height="37" rx="4" fill="#132f30"/>
      <path d="M56 49h37m-37 7h27m-27 7h18"/>
    </g>
    </g>
  </g>
  <g transform="translate(350 0)">
    <rect width="350" height="210" fill="#39272e"/>
    <path d="M0 2h350" stroke="#ffb28e" stroke-width="4"/>
    <text class="title" x="24" y="49" font-size="27" fill="#fff7ee">RetinaBridge</text>
    <text class="metric" x="20" y="143" font-size="86" fill="#ffb28e">5</text>
    <text class="caption" x="25" y="184" font-size="20" fill="#eed7cc">Grades in the retinal model</text>
    <g transform="translate(187 62) scale(1.13)" color="#ffb28e">
    <g fill="currentColor">
      <rect x="8" y="50" width="15" height="16" rx="2" opacity="0.43"/>
      <rect x="30" y="41" width="15" height="25" rx="2" opacity="0.58"/>
      <rect x="52" y="31" width="15" height="35" rx="2" opacity="0.72"/>
      <rect x="74" y="20" width="15" height="46" rx="2" opacity="0.87"/>
      <rect x="96" y="8" width="15" height="58" rx="2" opacity="1"/>
    </g>
    <g fill="currentColor" font-family="monospace" font-size="10" text-anchor="middle">
      <text x="15.5" y="80">0</text>
      <text x="37.5" y="80">1</text>
      <text x="59.5" y="80">2</text>
      <text x="81.5" y="80">3</text>
      <text x="103.5" y="80">4</text>
    </g>
    </g>
  </g>
  <g transform="translate(700 0)">
    <rect width="350" height="210" fill="#293322"/>
    <path d="M0 2h350" stroke="#d1e57b" stroke-width="4"/>
    <text class="title" x="24" y="49" font-size="27" fill="#f9f9e9">AgriLens</text>
    <text class="metric" x="20" y="143" font-size="86" fill="#d1e57b">22</text>
    <text class="caption" x="25" y="184" font-size="20" fill="#e0e6c7">Crop labels in the benchmark</text>
    <g transform="translate(187 62) scale(1.13)" color="#d1e57b">
    <g fill="currentColor">
      <g transform="translate(0 0)"><circle cx="5" cy="29" r="3.5"/><circle cx="15.2" cy="29" r="3.5"/><circle cx="25.4" cy="29" r="3.5"/><circle cx="35.599999999999994" cy="29" r="3.5"/><circle cx="45.8" cy="29" r="3.5"/><circle cx="56" cy="29" r="3.5"/><circle cx="66.19999999999999" cy="29" r="3.5"/><circle cx="76.39999999999999" cy="29" r="3.5"/><circle cx="86.6" cy="29" r="3.5"/><circle cx="96.8" cy="29" r="3.5"/><circle cx="107" cy="29" r="3.5"/></g>
      <g transform="translate(0 18)"><circle cx="5" cy="29" r="3.5"/><circle cx="15.2" cy="29" r="3.5"/><circle cx="25.4" cy="29" r="3.5"/><circle cx="35.599999999999994" cy="29" r="3.5"/><circle cx="45.8" cy="29" r="3.5"/><circle cx="56" cy="29" r="3.5"/><circle cx="66.19999999999999" cy="29" r="3.5"/><circle cx="76.39999999999999" cy="29" r="3.5"/><circle cx="86.6" cy="29" r="3.5"/><circle cx="96.8" cy="29" r="3.5"/><circle cx="107" cy="29" r="3.5"/></g>
    </g>
    <path d="M3 60v4h106v-4" fill="none" stroke="currentColor" opacity=".56" stroke-width="1.3"/>
    </g>
  </g>
  </g>
</svg>
