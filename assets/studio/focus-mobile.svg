1.0 887.5Q720 910 703 921Q685 933 665.0 936.0Q645 939 624 939Q504 939 402.5 807.0Q301 675 274 478Q344 488 432.0 506.5Q520 525 578 555Q661 598 701.5 665.5Q742 733 742 826Z" transform="translate(402.83 79.00) scale(0.017578 -0.017578)"/></g><path d="M12 101H428" fill="none" stroke="var(--line)"/><text x="12" y="136" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="var(--accent)">Applied machine learning</text><text x="12" y="168" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="var(--ink)">I explore how models should be evaluated, what</text><text x="12" y="197" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="var(--ink)">their errors reveal, and how experiments can be</text><text x="12" y="226" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="var(--ink)">made reproducible.</text><text x="12" y="272" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="var(--accent)">Computer vision</text><text x="12" y="304" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="var(--ink)">I work with image-processing and recognition</text><text x="12" y="333" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="var(--ink)">workflows, with an interest in making model</text><text x="12" y="362" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="var(--ink)">decisions easier to inspect.</text><text x="12" y="408" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="var(--accent)">Software &amp; interfaces</text><text x="12" y="440" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="var(--ink)">I connect technical experiments with clear APIs,</text><text x="12" y="469" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="var(--ink)">thoughtful controls, and applications people can</text><text x="12" y="498" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="var(--ink)">explore.</text></g></svg>
