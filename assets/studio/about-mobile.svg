464 478.0 443.0Q383 422 268 408Q268 250 326.5 166.5Q385 83 498 83Q598 83 674.5 133.0Q751 183 825 282L882 240Q802 118 682.0 45.0Q562 -28 433 -28Q256 -28 162.5 71.0Q69 170 69 352Q69 478 108.5 592.5Q148 707 224 802Q298 895 405.5 952.0Q513 1009 643 1009Q787 1009 856.5 950.5Q926 892 926 801ZM742 826Q742 865 731.0 887.5Q720 910 703 921Q685 933 665.0 936.0Q645 939 624 939Q504 939 402.5 807.0Q301 675 274 478Q344 488 432.0 506.5Q520 525 578 555Q661 598 701.5 665.5Q742 733 742 826Z" transform="translate(260.17 79.00) scale(0.017578 -0.017578)"/></g><path d="M12 101H428" fill="none" stroke="var(--line)"/><text x="12" y="136" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="var(--ink)">I&#x27;m Om Solanki, an AI/ML student based in</text><text x="12" y="165" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="var(--ink)">Bengaluru, India, pursuing a B.Tech in Computer</text><text x="12" y="194" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="var(--ink)">Science &amp; AI/ML at Jain University.</text><text x="12" y="240" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="var(--ink)">I enjoy working at the intersection of machine</text><text x="12" y="269" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="var(--ink)">learning and software development: understanding</text><text x="12" y="298" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="var(--ink)">a dataset, experimenting with a model, and building</text><text x="12" y="327" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="var(--ink)">an interface that makes the result easier to explore.</text><text x="12" y="356" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="var(--ink)">My projects span computer vision, local</text><text x="12" y="385" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="var(--ink)">language-model evaluation, security analytics, and</text><text x="12" y="414" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="var(--ink)">web applications.</text><text x="12" y="460" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="var(--ink)">I&#x27;m especially interested in the details that make an</text><text x="12" y="489" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="var(--ink)">experiment understandable: clear inputs, useful</text><text x="12" y="518" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="var(--ink)">baselines, visible limitations, and results someone</text><text x="12" y="547" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="var(--ink)">else can inspect. Alongside project work, I&#x27;m</text><text x="12" y="576" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="var(--ink)">strengthening my foundations in data structures,</text><text x="12" y="605" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="var(--ink)">algorithms, databases, and application design.</text></g></svg>
