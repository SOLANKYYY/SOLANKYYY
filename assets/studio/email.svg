<svg xmlns="http://www.w3.org/2000/svg" width="180" height="48" viewBox="0 0 180 48" role="img" aria-labelledby="title desc">
<title id="title">Email me</title><desc id="desc">Email me. Full text is available in PROFILE.md.</desc>
<style>
  :root{--ink:#233d45;--accent:#356b77;--secondary:#8a6c47;--line:#d7e2e4;--surface:#fbfcfc;--tint:#eef4f4;--header-start:#f1eaff;--header-middle:#fff1e8;--header-end:#edf8ff;--status:#25834c}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-out infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.45}80%,100%{transform:scale(2.1);opacity:0}}
  @media(prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.15}}
</style><defs><clipPath id="frame"><rect width="180" height="48" rx="14"/></clipPath></defs>
<g clip-path="url(#frame)"><rect x="1" y="1" width="178" height="46" rx="14" fill="#fff1e8" stroke="var(--line)"/><text x="90" y="31" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="var(--accent)">Email me</text></g></svg>
