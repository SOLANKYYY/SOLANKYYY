name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate gold snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: SOLANKYYY
          outputs: |
            dist/github-contribution-grid-snake-gold.svg?color_snake=%23FFD700&color_dots=0:0D0D0D,1:FFD700,2:FFD700,3:FFFFFF,4:FFFFFF

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
