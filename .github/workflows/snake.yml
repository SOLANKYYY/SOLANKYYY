name: Generate Contribution Snake

"on":
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"
      - "ReadMe.md"

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate emerald and legacy gold animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: SOLANKYYY
          outputs: |
            dist/github-contribution-grid-snake-pastel.svg?color_snake=%2316a34a&color_dots=%23f5f2ee,%23eadcf5,%23cbdef1,%23a7d9c4,%2379b38a
            dist/github-contribution-grid-snake.svg?color_snake=%2316a34a&color_dots=%23edf3ed,%23c6e8ce,%2385ce9c,%2349a86b,%23216e39
            dist/github-contribution-grid-snake-gold.svg?color_snake=%23FFD700&color_dots=%230D0D0D,%23756420,%23B59B20,%23FFD700,%23FFFFFF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add the light canvas
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path('dist/github-contribution-grid-snake-pastel.svg')
          namespace = 'http://www.w3.org/2000/svg'
          ET.register_namespace('', namespace)
          tree = ET.parse(path)
          root = tree.getroot()
          background = ET.Element(f'{{{namespace}}}rect', {
              'width': '100%', 'height': '100%', 'rx': '14',
              'fill': '#fff9f2', 'stroke': 'none'
          })
          root.insert(0, background)
          tree.write(path, encoding='utf-8', xml_declaration=True)
          PY

      - name: Publish contribution animations
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
